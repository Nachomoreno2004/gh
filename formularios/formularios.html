<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Formularios</title>
</head>
<body>
   <h1>Ejercicio de Formularios</h1>
   <h2>Formulario 1</h2>
    <fieldset>
    <legend>Completar</legend>
    <label for="color">Elija un color:</label>
    <input type="color" id="color" name="color">   
    </br>
    <textarea rows="5" cols="53" placeholder="Por favor, escriba aquí"></textarea>
    </br>
    <label for="language">Lenguaje</label>
    <select name="language" id="language">
        <option value="java">Java</option>
        <option value="python">Python</option>
        <option value="html">HTML</option>
        <option value="visual_basic">Visual Basic</option>
    </select>
    </br>   
    <label for="check1">ASIR</label>
        <imput type="checkbox" id="check1" name="ciclo" value="cicloasir">
    <label for="check2">DAM</label>
        <imput type="checkbox" id="check2" name="ciclo" value="ciclodam">
    <label for="check3">DAW</label>
        <imput type="checkbox" id="check3" name="ciclo" value="ciclodaw">
    </label>
    </fieldset> 
    <fieldset>
    <legend>Rellene las opciones siguientes</legend>
    <label for="date-imput">Elija una fecha:</label>
    <input type="date" id="date-imput" name="date">
    </br>
    <label for="file-imput">Elija un fichero:</label>
    </fieldset>
</body>
</html>
