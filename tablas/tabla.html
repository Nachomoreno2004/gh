<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis primeras tablas</title>
    <style>
        table, td, th, tr{
            border: 1px solid red;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>Mis primeras tablas</h1>
    <table BORDER="1">
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td rowspan="2">1º</td>
            <td >Laura Gomez</td>
            <td>9.5</td>
        </tr>
        <tr>
            <td>Juan Perez</td>
            <td>8.0</td>
        </tr>
    </table>
</br>
    <table BORDER="1">
        <tr>
            <th>A</th>
            <th>B</th>
            <th>C</th>
        </tr>
        <tr>
            <td>A</td>
            <td COLSPAN="2">B</td>
        </tr>
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
        </tr>
    </table>
</br>
    <table border="1">
        <tr>
            <td>1</td>
            <td colspan="2">2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td rowspan="2">6</td>
            <td>7</td>
            <td>8</td>
        </tr>
        <tr>
            <td>9</td>
            <td>10</td>
        </tr>
    </table>
</br>
    <table border="1" style="border: 4 px">
        <tr>
            <td>1</td>
            <td><table border="1">
                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>1</td>
                    <td>1</td>
                    <td>1</td>
                </tr>
            </table></td>
        </tr>
        <tr>
            <td>1</td>
            <td>1</td>
        </tr>
    </table>
</body>
</html>
