<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
</head>
<body style="background-image: url(fotos/fondo1.jpg);">
    <h1 style="font-family: 'Times New Roman', Times, serif; color: rgb(39, 2, 201);">Contacto</h1>
    <fieldset>
        <legend>¿Tienes alguna duda? Contacta con nosotros a traves de este formulario:</legend>
        <label for="nombre">Nombre</label>
        <input type="text" id="Nombre" name="nombre" placeholder="Nombre">
    </br>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Apellido">
    </br>
        <label for="Correo">Correo Electrónico</label>
        <input type="text" id="Correo" name="Correo" placeholder="Correo Electrónico">
    </br>
        <label for="Teléfono">Teléfono contacto</label>
        <input type="text" id="Teléfono" name="Teléfono" placeholder="Teléfono Contacto">
    </br>
         <label for="fichero">Sobre que tema tienes duda?</label>
         <select name="Duda">
        <option value="java">Colchones</option>
        <option value="python">Sofa</option>
        <option value="html">Sillones</option>
        <option value="visual_basic">Otro</option>
    </select>
    </br>
        <textarea name="texto" rows="5" cols="59" placeholder="Escriba aquí, por favor"></textarea>
    </br>
    <input type="submit" value="Enviar">
    </fieldset>

    <p><a href="IndexEmpresa.html">Volver a Index</a></p>

</body>
</html>
