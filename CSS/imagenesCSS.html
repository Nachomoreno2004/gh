<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrado imágenes</title>

    <style>
        img[src="css.jpg"]{
            display:block;
            margin: 0 auto;
            height: 200px;
            position: fixed;
            right: 20px
    }

    img[src="css2.jpg"]{
        display:block;
        margin: 0 auto;
        height: 100px;
        position: absolute;
        bottom: 20px;
        border: 20px solid black;
    }
    </style>
</head>
<body>
    <img src="css.jpg">
    <img src="css2.jpg">
    
</body>
</html>
