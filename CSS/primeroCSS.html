<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer CSS</title>
    <style>
        P{
            font-size: 20px;
        }
        .parrafo-azul {
            color: rgb(0, 106, 255);
            font-family: Arial, Helvetica, sans-serif;
        }
        .parrafo-verde {
            color: rgb(20, 200, 20);
            font-family: 'Courier New', 'Georgia';
        }
        .parrafo-amarillo {
            color: #FFFF00;
  }
    </style>
</head>
<body>
    <h1 class="parrafo-azul">Empezando con CSS</h1>
    <p class="parrafo-azul">Esto va de color azul</p>
    <p class="parrafo-verde">Esto va de color verde</p>
    <p class="parrafo-amarillo">Esto va de color amarillo</p>

    <div style="border: 2px dotted red ; padding: 50px; margin: 50px;">Primer bloque</div>
    <div style="border: 5px dashed green; padding-top: 100px; margin-top: 50px;">Segundo bloque</div>
</body>
</html>
